[package]
name = "resetexplode"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "RESET EXPLODE para Linux: informações do sistema, sensores, benchmarks, stress e ferramentas de PC (TUI + CLI) em Rust"
license = "MIT"
readme = "README.md"
keywords = ["hardware", "benchmark", "tui", "linux", "sensors"]
categories = ["command-line-utilities", "hardware-support"]

[lib]
name = "resetexplode"
path = "src/lib.rs"

[[bin]]
name = "resetexplode"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "underline-color", "layout-cache"] }
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3.5"

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
